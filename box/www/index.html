const biM=i=>(!F.bot||(i.owners||[]).includes(F.bot))&&(!F.state||biCat(i)===F.state);
function donut(){ // open items by bot
 const data=D.bots.map(b=>({b,v:D.open.filter(j=>j.owner===b.name).length})).filter(x=>x.v);
 const tot=data.reduce((a,x)=>a+x.v,0);let a0=-Math.PI/2,s='';const R=80,r=52,cx=100,cy=100;
 if(!tot)s=`<circle cx="100" cy="100" r="66" fill="none" stroke="#2a2645" stroke-width="28"/>`;
 data.forEach(x=>{const a1=a0+2*Math.PI*x.v/tot-(data.length>1?.02:0);const L=a1-a0>Math.PI?1:0;const P=(a,R)=>[cx+R*Math.cos(a),cy+R*Math.sin(a)];
  if(data.length===1){s+=`<circle cx="100" cy="100" r="66" fill="none" stroke="${accent(x.b.color)}" stroke-width="28"/>`}else{
  const [x1,y1]=P(a0,R),[x2,y2]=P(a1,R),[x3,y3]=P(a1,r),[x4,y4]=P(a0,r);
  s+=`<path d="M${x1} ${y1}A${R} ${R} 0 ${L} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${L} 0 ${x4} ${y4}Z" fill="${accent(x.b.color)}" style="cursor:pointer" onclick="setF('bot','${esc(x.b.name)}')"><title>${esc(x.b.name)}: ${x.v}</title></path>`}
  a0=a1+(data.length>1?.02:0)});
 document.getElementById('donut').innerHTML=`<svg viewBox="0 0 200 200" width="100%" style="max-width:220px;display:block;margin:auto">${s}<text x="100" y="98" text-anchor="middle" fill="#ece9ff" font-size="30" font-weight="700">${tot}</text><text x="100" y="120" text-anchor="middle" fill="#9a94c4" font-size="12">open items</text></svg>`;
 const sc=D.counts;
 document.getElementById('dleg').innerHTML=data.map(x=>`<span><i style="background:${accent(x.b.color)}"></i>${esc(x.b.name)} ${x.v}</span>`).join('')+'<br>'+Object.entries(ST).map(([k,[cl,l]])=>`<span class="badge ${cl}">${l} ${sc[k]||0}</span>`).join(' ')+'<br><span>State colors: red = needs you · yellow = waiting on another bot · blue = in progress · green = done. Bot colors = avatar identity.</span>';
}
function bars(){const days=D.activity.days,by=D.activity.by_day;const W=700,H=180,pad=24,bw=(W-pad)/days.length;
 const max=Math.max(1,...days.map(d=>Object.values(by[d]).reduce((a,b)=>a+b,0)));let s='',used=new Set();
 days.forEach((d,i)=>{let y=H-20;Object.entries(by[d]).sort().forEach(([o,v])=>{const h=(H-40)*v/max;const b=botBy(o);used.add(o);s+=`<rect x="${pad+i*bw+3}" y="${y-h}" width="${bw-6}" height="${h}" rx="3" fill="${accent(b.color)}"><title>${esc(o)} · ${d}: ${v}</title></rect>`;y-=h});
  const t=Object.values(by[d]).reduce((a,b)=>a+b,0);if(t)s+=`<text x="${pad+i*bw+bw/2}" y="${y-4}" text-anchor="middle" fill="#9a94c4" font-size="10">${t}</text>`;
  s+=`<text x="${pad+i*bw+bw/2}" y="${H-5}" text-anchor="middle" fill="#6f6a96" font-size="10">${d.slice(5).replace('-','/')}</text>`});
 document.getElementById('bars').innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="${pad}" x2="${W}" y1="${H-20}" y2="${H-20}" stroke="#2a2645"/>${s}</svg>`;
 document.getElementById('bleg').innerHTML=[...used].map(o=>`<span><i style="background:${accent(botBy(o).color)}"></i>${esc(o)}</span>`).join('');
}
CO.init({dl:DL,data:()=>D,rerender:()=>{if(D)render()}});

autoLoad();setInterval(autoLoad,10*60*1000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')autoLoad()});
